# Railway — CasaClick (Docker multi-stage build)
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CMD is set in Dockerfile; startCommand runs migrations then PHP server
startCommand = "sh scripts/railway-start.sh"
# Lightweight probe (no Symfony/DB). App API: /api/mobile/health
healthcheckPath = "/railway-health.php"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
